server {
    listen 80;
    listen [::]:80;

    server_name keyport.asp.app;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name keyport.asp.app;

    ssl_certificate     /etc/letsencrypt/live/keyport.asp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keyport.asp.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8k;

    location /key/ {
        limit_req zone=keyport_api burst=5;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Keyport-Source-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Keyport-Source-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
